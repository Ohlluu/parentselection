<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <title>Election Results</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body class="shared-results">
  <main class="shell shell--wide">
    <header class="bar">
      <div><h1>Election results</h1><p class="sub">All centers · read-only</p></div>
      <div class="row-actions">
        <button id="refresh-results" type="button">Refresh</button>
        <button id="print-results" type="button" disabled>Print results</button>
      </div>
    </header>
    <p>Weighted votes by center and position. Labels show current leaders while voting is open.</p>
    <p id="results-updated" class="meta"></p>
    <div id="results-message" role="status" aria-live="polite">Loading results…</div>
    <div id="shared-centers" class="site-grid"></div>
  </main>
  <script src="/shared-results.js"></script>
</body>
</html>
